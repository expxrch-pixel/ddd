<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OTF — onythefamily Roster & Member Showcase">
  <title>OTF — onythefamily</title>
  <link rel="icon" type="image/jpeg" href="otf-logo.jpg">
  <link rel="shortcut icon" href="otf-logo.jpg" type="image/x-icon">
  <link rel="apple-touch-icon" href="otf-logo.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

  <!-- Ambient Backdrop & Canvas Particles -->
  <div class="site-backdrop" aria-hidden="true"></div>
  <div class="ambient-glow-mesh" aria-hidden="true"></div>
  <canvas id="weatherCanvas"></canvas>

  <!-- Navigation Topbar -->
  <header class="topbar shell">
    <a class="brand" href="index.html" aria-label="OTF Home">
      <div class="brand-box">
        <img src="otf-logo.jpg" alt="OTF Logo">
      </div>
      <div class="brand-text">
        <span class="brand-word">OTF</span>
        <span class="brand-sub">onythefamily</span>
      </div>
    </a>

    <nav class="nav" aria-label="Main Navigation">
      <a class="active" href="index.html">Home</a>
      <a href="members.html">Members</a>
    </nav>
  </header>

  <!-- Main Hero Section -->
  <main class="minimal-home shell">
    <section class="minimal-home-copy">
      <div class="brand-title-wrap">
        <h1>OTF</h1>
        <div class="minimal-home-subtitle">onythefamily</div>
      </div>
      <p class="minimal-tagline">LOYALTY OVER ROYALTY</p>

      <div class="minimal-home-actions">
        <a class="primary-button" href="members.html">
          ดูรายชื่อสมาชิก <span>→</span>
        </a>
      </div>
    </section>

    <!-- Right 3D Rotating Logo Showcase -->
    <aside class="minimal-home-showcase" aria-label="OTF 3D Logo">
      <div class="home-logo-rotator">
        <img class="logo-3d-spin" src="otf-logo.jpg" alt="Only The Family OTF 3D Logo">
      </div>
    </aside>
  </main>

  <!-- Simple Footer -->
  <footer class="site-footer">
    <p>@2026 OTF Onythefamily</p>
  </footer>

  <!-- Core Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="members-data.js"></script>
  <script src="ui-effects.js"></script>
  <script src="music-player.js"></script>
</body>
</html>
